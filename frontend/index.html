<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAPS Design | Generative Structural Design</title>
    <script>
      window.onerror = function (message, source, lineno, colno, error) {
        const root = document.getElementById('root')
        if (root) {
          root.innerHTML =
            '<div style="background:#0f1115;color:#ef4444;font-family:system-ui,sans-serif;height:100vh;padding:2rem;box-sizing:border-box;">' +
            '<h1 style="font-size:1.25rem;margin-bottom:1rem;">DAPS Design failed to start</h1>' +
            '<p style="color:#9ca3af;margin-bottom:1rem;">A JavaScript error prevented the app from loading. Please check the browser console and share the error.</p>' +
            '<pre style="background:#16181f;padding:1rem;border-radius:0.5rem;overflow:auto;font-size:0.75rem;">' +
            (message || '') + ' at ' + (source || '') + ':' + lineno + ':' + colno + '\n' + (error && error.stack ? error.stack : '') +
            '</pre></div>'
        }
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div style="background:#0f1115;color:#9ca3af;font-family:system-ui,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0.5rem;">
        <div style="font-size:1.25rem;font-weight:600;color:#f3f4f6;">DAPS Design</div>
        <div style="font-size:0.875rem;">Loading generative CAD workspace…</div>
      </div>
    </div>
    <noscript>
      <div style="background:#0f1115;color:#9ca3af;font-family:system-ui,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;">
        JavaScript is required to run DAPS Design.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
