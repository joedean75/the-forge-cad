services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: daps
      POSTGRES_PASSWORD: daps
      POSTGRES_DB: daps
    volumes:
      - daps_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daps"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      # Durable store. Comment this out to fall back to the embedded SQLite file.
      DATABASE_URL: postgresql+psycopg://daps:daps@db:5432/daps
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend

volumes:
  daps_pgdata:
