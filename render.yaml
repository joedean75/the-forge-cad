# Render.com blueprint — one managed Postgres + the Docker web service.
# Deploy: push this repo to GitHub, then "New > Blueprint" in Render and point it
# here. Set the `sync: false` secrets in the dashboard. See DEPLOY.md.

databases:
  - name: forge-db
    databaseName: forge
    user: forge
    plan: basic-256mb          # bump as data grows; enables automated backups

services:
  - type: web
    name: forge
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard             # torch/scipy/meshing need real RAM+CPU; not free-tier
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: forge-db
          property: connectionString
      - key: FORGE_AUTH_REQUIRED     # enforce real auth in production
        value: "1"
      - key: FORGE_JWT_SECRET        # stable signing secret (generated once)
        generateValue: true

      # Render terminates TLS at its own load balancer and forwards the real
      # client address in `X-Forwarded-For`. Without this the app trusts the
      # socket peer instead — which *is* that load balancer — so every caller
      # in the world collapses into one rate-limit bucket and ten failed logins
      # from anybody locks out the whole deployment. One hop, because there is
      # exactly one Render proxy in front of the container.
      #
      # The image already runs gunicorn with `--forwarded-allow-ips=`, so the
      # server does not rewrite the peer itself and `app/rate_limit.py` is the
      # single place that decides what is trusted. See DEPLOY.md.
      - key: FORGE_TRUSTED_PROXY_HOPS
        value: "1"

      - key: FORGE_CORS_ORIGINS      # SPA is same-origin; set only if you split hosts
        value: ""

      # Where the sparse solves run. Render's standard plan is CPU-only, so this
      # is pinned rather than left to autodetect — it makes the choice visible in
      # the dashboard instead of implicit. Change it if you move to a GPU host.
      - key: FORGE_DEVICE
        value: "cpu"

      - key: PUBLIC_BASE_URL        # your public URL, for OAuth/Stripe redirects
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_ENTERPRISE
        sync: false

      # Optional. Without it the app runs fine and *describing* a part is
      # unavailable — text-to-CAD and text-to-assembly refuse with a typed
      # error pointing at the templates, which build a parametric part with no
      # model involved. There is no rule-based fallback any more: it answered
      # every description with a box, which was worse than refusing.
      - key: LLM_API_KEY
        sync: false
